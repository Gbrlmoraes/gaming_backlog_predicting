[project]
name = "gaming-backlog-predicting"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "category-encoders>=2.9.0",
    "gspread>=6.2.1",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "shap>=0.52.0",
]

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'LOG', 'TD', 'PD']

[tool.ruff.format]
preview = true
quote-style = 'single'

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
pre_lint = 'ruff format'
lint = 'ruff check --fix'
